name: quantix_customer_app
description: Quantix Customer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.2.3

  # HTTP
  dio: ^5.9.2

  # Code generation annotations
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^10.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Maps
  google_maps_flutter: ^2.10.0

  # Networking / images
  cached_network_image: ^3.4.1

  # Real-time
  socket_io_client: ^2.0.3+1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ">=2.4.0 <2.4.14"
  freezed: ">=2.4.0 <2.5.3"
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - branding/quantix/
    - branding/arbaz/
    - branding/salon/
    - branding/restaurant/
