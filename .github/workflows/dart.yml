name: Quantix Mobile CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Static analysis + tests
  # ─────────────────────────────────────────────────────────────────────────
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=customer_app
          flutter pub get --directory=delivery_app
          flutter pub get --directory=admin_app

      - name: Write Firebase options (secrets override placeholder stubs)
        run: |
          if [ -n "$CUSTOMER_FIREBASE_OPTIONS" ]; then
            echo "$CUSTOMER_FIREBASE_OPTIONS" > customer_app/lib/firebase_options.dart
          fi
          if [ -n "$DELIVERY_FIREBASE_OPTIONS" ]; then
            echo "$DELIVERY_FIREBASE_OPTIONS" > delivery_app/lib/firebase_options.dart
          fi
          if [ -n "$ADMIN_FIREBASE_OPTIONS" ]; then
            echo "$ADMIN_FIREBASE_OPTIONS" > admin_app/lib/firebase_options.dart
          fi
        env:
          CUSTOMER_FIREBASE_OPTIONS: ${{ secrets.CUSTOMER_FIREBASE_OPTIONS }}
          DELIVERY_FIREBASE_OPTIONS: ${{ secrets.DELIVERY_FIREBASE_OPTIONS }}
          ADMIN_FIREBASE_OPTIONS: ${{ secrets.ADMIN_FIREBASE_OPTIONS }}

      - name: Analyze — customer_app
        working-directory: customer_app
        run: flutter analyze --no-pub

      - name: Analyze — delivery_app
        working-directory: delivery_app
        run: flutter analyze --no-pub

      - name: Analyze — admin_app
        working-directory: admin_app
        run: flutter analyze --no-pub

      - name: Test — customer_app
        working-directory: customer_app
        run: flutter test || true

  # ─────────────────────────────────────────────────────────────────────────
  # Customer app builds (APK + AAB)
  # ─────────────────────────────────────────────────────────────────────────
  build-customer-apk:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=customer_app

      - name: Write Firebase options
        working-directory: customer_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.CUSTOMER_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write google-services.json (customer)
        env:
          GOOGLE_SERVICES: ${{ secrets.CUSTOMER_GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > customer_app/android/app/google-services.json
          else
            python3 -c 'import json; print(json.dumps({"project_info":{"project_number":"000000000000","project_id":"quantix-ci","storage_bucket":"quantix-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.quantix.customer"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"},indent=2))' > customer_app/android/app/google-services.json
          fi

      - name: Write keystore
        working-directory: customer_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build APK
        working-directory: customer_app
        run: flutter build apk --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-customer-release-apk
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk

  build-customer-aab:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=customer_app

      - name: Write Firebase options
        working-directory: customer_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.CUSTOMER_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write google-services.json (customer)
        env:
          GOOGLE_SERVICES: ${{ secrets.CUSTOMER_GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > customer_app/android/app/google-services.json
          else
            python3 -c 'import json; print(json.dumps({"project_info":{"project_number":"000000000000","project_id":"quantix-ci","storage_bucket":"quantix-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.quantix.customer"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"},indent=2))' > customer_app/android/app/google-services.json
          fi

      - name: Write keystore
        working-directory: customer_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build App Bundle
        working-directory: customer_app
        run: flutter build appbundle --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-customer-release-aab
          path: customer_app/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────────────────────────────────
  # Delivery app build (AAB)
  # ─────────────────────────────────────────────────────────────────────────
  build-delivery-aab:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=delivery_app

      - name: Write Firebase options
        working-directory: delivery_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.DELIVERY_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write google-services.json (delivery)
        env:
          GOOGLE_SERVICES: ${{ secrets.DELIVERY_GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > delivery_app/android/app/google-services.json
          else
            python3 -c 'import json; print(json.dumps({"project_info":{"project_number":"000000000000","project_id":"quantix-ci","storage_bucket":"quantix-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.quantix.delivery"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"},indent=2))' > delivery_app/android/app/google-services.json
          fi

      - name: Write keystore
        working-directory: delivery_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build App Bundle
        working-directory: delivery_app
        run: flutter build appbundle --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-delivery-release-aab
          path: delivery_app/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────────────────────────────────
  # Admin app build (AAB)
  # ─────────────────────────────────────────────────────────────────────────
  build-admin-aab:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=admin_app

      - name: Write Firebase options
        working-directory: admin_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.ADMIN_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write google-services.json (admin)
        env:
          GOOGLE_SERVICES: ${{ secrets.ADMIN_GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > admin_app/android/app/google-services.json
          else
            python3 -c 'import json; print(json.dumps({"project_info":{"project_number":"000000000000","project_id":"quantix-ci","storage_bucket":"quantix-ci.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.quantix.admin"}},"oauth_client":[],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"},indent=2))' > admin_app/android/app/google-services.json
          fi

      - name: Write keystore
        working-directory: admin_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build App Bundle
        working-directory: admin_app
        run: flutter build appbundle --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-admin-release-aab
          path: admin_app/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────────────────────────────────
  # Notify provision service — runs after all builds regardless of outcome.
  # Only fires for tenant repos (repo name ends in -Mobile); skips master repo.
  # ─────────────────────────────────────────────────────────────────────────
  notify-provision:
    needs: [build-customer-apk, build-customer-aab, build-delivery-aab, build-admin-aab]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Report build outcome to provision service
        env:
          PROVISION_WEBHOOK_URL: ${{ secrets.PROVISION_WEBHOOK_URL }}
          PROVISION_API_KEY: ${{ secrets.PROVISION_API_KEY }}
          APK_RESULT: ${{ needs.build-customer-apk.result }}
          AAB_RESULT: ${{ needs.build-customer-aab.result }}
          DEL_RESULT: ${{ needs.build-delivery-aab.result }}
          ADM_RESULT: ${{ needs.build-admin-aab.result }}
        run: |
          if [ -z "$PROVISION_WEBHOOK_URL" ]; then
            echo "PROVISION_WEBHOOK_URL not set — skipping provision notification"
            exit 0
          fi

          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ "$REPO_NAME" != *-Mobile ]]; then
            echo "Not a tenant repo (${REPO_NAME}) — skipping provision notification"
            exit 0
          fi

          SLUG="${REPO_NAME%-Mobile}"
          SLUG="${SLUG,,}"

          if [ "$APK_RESULT" = "success" ] && [ "$AAB_RESULT" = "success" ] && \
             [ "$DEL_RESULT" = "success" ] && [ "$ADM_RESULT" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          APK_URL=""
          AAB_URL=""
          if [ "$APK_RESULT" = "success" ]; then APK_URL="$RUN_URL"; fi
          if [ "$AAB_RESULT" = "success" ]; then AAB_URL="$RUN_URL"; fi

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $PROVISION_API_KEY" \
            "${PROVISION_WEBHOOK_URL}/mobile/webhook/ci-artifact" \
            -d "{\"slug\":\"$SLUG\",\"status\":\"$STATUS\",\"apkUrl\":\"$APK_URL\",\"aabUrl\":\"$AAB_URL\"}")
          echo "Provision service responded: $HTTP (slug=$SLUG status=$STATUS)"
