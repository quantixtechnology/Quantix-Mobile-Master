name: Quantix Mobile CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Static analysis + tests
  # ─────────────────────────────────────────────────────────────────────────
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=customer_app
          flutter pub get --directory=delivery_app
          flutter pub get --directory=admin_app

      - name: Write Firebase options (secrets override placeholder stubs)
        run: |
          if [ -n "$CUSTOMER_FIREBASE_OPTIONS" ]; then
            echo "$CUSTOMER_FIREBASE_OPTIONS" > customer_app/lib/firebase_options.dart
          fi
          if [ -n "$DELIVERY_FIREBASE_OPTIONS" ]; then
            echo "$DELIVERY_FIREBASE_OPTIONS" > delivery_app/lib/firebase_options.dart
          fi
          if [ -n "$ADMIN_FIREBASE_OPTIONS" ]; then
            echo "$ADMIN_FIREBASE_OPTIONS" > admin_app/lib/firebase_options.dart
          fi
        env:
          CUSTOMER_FIREBASE_OPTIONS: ${{ secrets.CUSTOMER_FIREBASE_OPTIONS }}
          DELIVERY_FIREBASE_OPTIONS: ${{ secrets.DELIVERY_FIREBASE_OPTIONS }}
          ADMIN_FIREBASE_OPTIONS: ${{ secrets.ADMIN_FIREBASE_OPTIONS }}

      - name: Analyze — customer_app
        working-directory: customer_app
        run: flutter analyze --no-pub

      - name: Analyze — delivery_app
        working-directory: delivery_app
        run: flutter analyze --no-pub

      - name: Analyze — admin_app
        working-directory: admin_app
        run: flutter analyze --no-pub

      - name: Test — customer_app
        working-directory: customer_app
        run: flutter test || true

  # ─────────────────────────────────────────────────────────────────────────
  # Customer app builds (APK + AAB)
  # ─────────────────────────────────────────────────────────────────────────
  build-customer-apk:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=customer_app

      - name: Write Firebase options
        working-directory: customer_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.CUSTOMER_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write keystore
        working-directory: customer_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build APK
        working-directory: customer_app
        run: flutter build apk --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-customer-release-apk
          path: customer_app/build/app/outputs/flutter-apk/app-release.apk

  build-customer-aab:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=customer_app

      - name: Write Firebase options
        working-directory: customer_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.CUSTOMER_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write keystore
        working-directory: customer_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build App Bundle
        working-directory: customer_app
        run: flutter build appbundle --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-customer-release-aab
          path: customer_app/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────────────────────────────────
  # Delivery app build (AAB)
  # ─────────────────────────────────────────────────────────────────────────
  build-delivery-aab:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=delivery_app

      - name: Write Firebase options
        working-directory: delivery_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.DELIVERY_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write keystore
        working-directory: delivery_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build App Bundle
        working-directory: delivery_app
        run: flutter build appbundle --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-delivery-release-aab
          path: delivery_app/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────────────────────────────────
  # Admin app build (AAB)
  # ─────────────────────────────────────────────────────────────────────────
  build-admin-aab:
    needs: analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get --directory=shared
          flutter pub get --directory=admin_app

      - name: Write Firebase options
        working-directory: admin_app/lib
        env:
          FIREBASE_OPTIONS: ${{ secrets.ADMIN_FIREBASE_OPTIONS }}
        run: |
          if [ -n "$FIREBASE_OPTIONS" ]; then
            echo "$FIREBASE_OPTIONS" > firebase_options.dart
          fi

      - name: Write keystore
        working-directory: admin_app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > quantix-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=quantix-release.jks\n' \
              "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
          fi

      - name: Build App Bundle
        working-directory: admin_app
        run: flutter build appbundle --release --dart-define=FLAVOR=quantix

      - uses: actions/upload-artifact@v4
        with:
          name: quantix-admin-release-aab
          path: admin_app/build/app/outputs/bundle/release/app-release.aab
