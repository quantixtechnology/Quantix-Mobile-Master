name: quantix_customer
description: Quantix Customer App — storefront for end customers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  quantix_shared:
    path: ../shared
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - branding/quantix/
    - branding/freshmart/
    - branding/arbazfreshmeat/
